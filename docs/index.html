<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>プラレール計算機シミュレータ</title>
<meta name="description" content="プラレールのレイアウト上で列車を自動走行させ、分岐レールのポイント状態で計算するシミュレータ">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">プラレール計算機</div>
  <div class="controls">
    <button id="btn-undo" title="元に戻す (Ctrl+Z)" aria-label="元に戻す">↶</button>
    <button id="btn-play" class="primary" title="再生/一時停止 (Space)" aria-label="再生">▶</button>
    <button id="btn-step" title="次のレールまで進める" aria-label="ステップ">⏭</button>
    <button id="btn-reset" title="初期状態に戻す" aria-label="リセット">⟲</button>
    <select id="speed" title="速度" aria-label="速度">
      <option value="0.5">×0.5</option>
      <option value="1" selected>×1</option>
      <option value="2">×2</option>
      <option value="4">×4</option>
      <option value="16">×16</option>
    </select>
    <button id="btn-menu" title="メニュー" aria-label="メニュー">☰</button>
  </div>
</header>
<div id="statusbar"><span id="status"></span><span id="bits"></span></div>
<main id="stage">
  <canvas id="canvas"></canvas>
  <div id="zoom">
    <button id="btn-zoom-in" aria-label="拡大">＋</button>
    <button id="btn-zoom-out" aria-label="縮小">－</button>
    <button id="btn-fit" aria-label="全体表示">⤢</button>
  </div>
  <div id="toast" hidden></div>
</main>
<section id="panel"></section>

<dialog id="modal">
  <div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" aria-label="閉じる">✕</button></div>
  <div id="modal-body"></div>
</dialog>
<input type="file" id="file-input" accept="application/json,.json" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
